name: Settings flush verify

on:
  pull_request:
    paths:
      - "src/App.tsx"
      - "src/core/storage.ts"
      - "src/core/debouncedSettingsSaver.ts"
      - "tests/settings-flush.test.ts"
      - ".github/workflows/settings-flush.yml"
  push:
    branches:
      - main
    paths:
      - "src/App.tsx"
      - "src/core/storage.ts"
      - "src/core/debouncedSettingsSaver.ts"
      - "tests/settings-flush.test.ts"
      - ".github/workflows/settings-flush.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run settings flush regressions
        run: npx tsx --test tests/settings-flush.test.ts
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install browser client
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify preset save failure recovery in Chrome
        run: node --test tests/preset-save-recovery.browser.mjs
