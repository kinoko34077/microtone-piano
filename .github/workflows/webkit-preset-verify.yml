name: Isolated WebKit preset lifecycle verify

on:
  pull_request:
    paths:
      - "tests/preset-lifecycle.webkit.browser.mjs"
      - ".github/workflows/webkit-preset-verify.yml"
      - "src/App.tsx"
      - "src/components/Sidebar.tsx"
      - "src/core/storage.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build isolated static app
        run: npm run build
      - name: Install pinned Playwright and Linux WebKit runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps webkit
      - name: Verify fresh WebKit storage, rejected write recovery and invalid import
        run: node --test --test-concurrency=1 tests/preset-lifecycle.webkit.browser.mjs
