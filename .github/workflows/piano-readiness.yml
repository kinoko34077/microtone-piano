name: Piano readiness verify

on:
  pull_request:
    paths:
      - "src/App.tsx"
      - "src/core/audio.ts"
      - "src/core/address.ts"
      - "src/core/laneBoundaries.ts"
      - "src/components/Keyboard/InteractiveKeyboard.tsx"
      - "src/components/Editor/PresetEditor.tsx"
      - "tests/active-section.test.ts"
      - "tests/piano-readiness.test.ts"
      - "tests/audio-pending-burst.browser.mjs"
      - "tests/audio-real-sample-chord.browser.mjs"
      - ".github/workflows/piano-readiness.yml"
  push:
    branches:
      - main
    paths:
      - "src/App.tsx"
      - "src/core/audio.ts"
      - "src/core/address.ts"
      - "src/core/laneBoundaries.ts"
      - "src/components/Keyboard/InteractiveKeyboard.tsx"
      - "src/components/Editor/PresetEditor.tsx"
      - "tests/active-section.test.ts"
      - "tests/piano-readiness.test.ts"
      - "tests/audio-pending-burst.browser.mjs"
      - "tests/audio-real-sample-chord.browser.mjs"
      - ".github/workflows/piano-readiness.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run piano readiness regressions
        run: npx tsx --test tests/piano-readiness.test.ts tests/active-section.test.ts
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install deterministic Chromium client
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Exercise actual audio module with controlled pending sample stress
        run: node --test tests/audio-pending-burst.browser.mjs
      - name: Measure real M4A chord cold/warm scheduling without audio code changes
        run: node --test tests/audio-real-sample-chord.browser.mjs
